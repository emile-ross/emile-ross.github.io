<html>
<head>
	<meta charset="UTF-8">
	<title>Jeux d'habiletés</title>
	<link rel="stylesheet" href="homepage-style.css">
</head>

<body>
<div class="page">

	<h1 lang="fr">Jeux d'habiletés</h1>
	<h1 lang="en">Skill games</h1>

	<h2 lang="fr">Compétitions</h2>
	<h2 lang="en">Competitions</h2>

<!-- make a small box (square/squircle) -->
<div id="cities"></div>
<script>  const cities = [
	{
		name: "Granby",      
		year: 2026,      
		updated: "2026/08/22",      
		u9Odg: "https://emile-ross.github.io/assets/2026/08/22/src/2026_U9_granby.odg",      
		u11u13Odg: "https://emile-ross.github.io/assets/2026/08/22/src/2026_U11_U13_granby.odg",
		u9Pdf: "https://emile-ross.github.io/assets/2026/08/22/2026_U9_granby.pdf",      
		u11u13Pdf: "https://emile-ross.github.io/assets/2026/08/22/2026_U11_U13_granby.pdf"
	},
	{
		name: "Boucherville",      
		year: 2026,      
		updated: "2026/08/08",      
		u9Odg: "https://emile-ross.github.io/assets/2026/08/08/src/2026_U9_boucherville.odg",      
		u11u13Odg: "https://emile-ross.github.io/assets/2026/08/08/src/2026_U11_U13_boucherville.odg",
		u9Pdf: "https://emile-ross.github.io/assets/2026/08/08/2026_U9_boucherville.pdf",      
		u11u13Pdf: "https://emile-ross.github.io/assets/2026/08/08/2026_U11_U13_boucherville.pdf"
	}, 
	{
		name: "Abitibi (Rouyn Noranda)",      
		year: 2026,      
		updated: "2026/07/18",      
		u9Odg: "https://emile-ross.github.io/assets/2026/07/18/src/2026_U9_abitibi.odg",      
		u11u13Odg: "https://emile-ross.github.io/assets/2026/07/18/src/2026_U11_U13_abitibi.odg",
		u9Pdf: "https://emile-ross.github.io/assets/2026/07/18/2026_U9_abitibi.pdf",      
		u11u13Pdf: "https://emile-ross.github.io/assets/2026/07/18/2026_U11_U13_abitibi.pdf"
	},
	{
		name: "Levis",      
		year: 2026,      
		updated: "2026/06/20",      
		u9Odg: "https://emile-ross.github.io/assets/2026/06/20/src/2026_U9_levis.odg",      
		u11u13Odg: "https://emile-ross.github.io/assets/2026/06/20/src/2026_U11_U13_levis.odg",
		u9Pdf: "https://emile-ross.github.io/assets/2026/06/20/2026_U9_levis.pdf",      
		u11u13Pdf: "https://emile-ross.github.io/assets/2026/06/20/2026_U11_U13_levis.pdf"
	}
];

	/* Write the html from the constant cities */
	const container = document.getElementById("cities");
	cities.forEach
	(city => { 
		const category = document.createElement("div");
		category.className = "category";
		/* make the html for english and french */
		category.innerHTML = `      
			<h3>${city.name} ${city.year}</h3>      
			<ul>        
				<li lang="en">U9 Layout <a href="${city.u9Pdf}">PDF U9</a></li>
				<li lang="fr">Parcours U9 <a href="${city.u9Pdf}">PDF U9</a></li>

				<li lang="en">U9 Layout (source) <a href="${city.u9Odg}">ODG U9</a></li>
				<li lang="fr">Parcours U9 (source) <a href="${city.u9Odg}">ODG U9</a></li>

				<li lang="en">U11-U13 Layout <a href="${city.u11u13Pdf}">PDF U11-U13</a></li>
				<li lang="fr">Parcours U11-U13 <a href="${city.u11u13Pdf}">PDF U11-U13</a></li>

				<li lang="en">U11-U13 Layout  (source) <a href="${city.u11u13Odg}">ODG U11-U13</a></li>
				<li lang="fr">Parcours U11-U13 (source) <a href="${city.u11u13Odg}">ODG U11-U13</a></li>
			</ul>    `;

	container.appendChild(category);  });

	const lang = navigator.language.toLowerCase();
	
	document.querySelectorAll("[lang]").forEach
	(el => {
		if (!lang.startsWith(el.lang.toLowerCase()))
		{
			el.hidden = true;
		}
	});
	</script>

</div>
</body>
</html>
